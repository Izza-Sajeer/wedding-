<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sajeer ❤️ Izza</title>
<style>
body{margin:0;background:#0f2a1d;color:#fff;font-family:Georgia,serif;text-align:center;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff8e7;color:#3a2a00;width:90%;max-width:360px;border-radius:16px;padding:22px;display:none}
.card.show{display:block}
h1{color:#b8860b;margin:5px 0}
.env{cursor:pointer}
.env .top{font-size:80px}
.env p{color:#ffd700}
button{background:#b8860b;color:#fff;border:0;padding:12px 20px;border-radius:20px;font-size:16px;margin-top:10px}
</style>
</head>
<body>

<div id="cover">
  <div class="env" onclick="openCard()">
    <div class="top">✉️</div>
    <h2 style="color:#ffd700">Tap to Open</h2>
    <p>Sajeer ❤️ Izza</p>
  </div>
</div>

<div id="invite" class="card">
  <p>✦ Bismillah ✦</p>
  <h1>Sajeer<br>❤️<br>Izza</h1>
  <p>We are getting married!</p>
  <p><b>Date:</b> Coming Soon</p>
  <p><b>Venue:</b> Talipparamba, Kerala</p>
  <p>Your presence is our blessing.</p>
  <button onclick="alert('Thank you! See you there ❤️')">RSVP ❤️</button>
</div>

<script>
function openCard(){
  document.getElementById('cover').style.display='none';
  document.getElementById('invite').classList.add('show');
}
</script>
</body>
</html>
